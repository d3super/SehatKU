<title>SigerFit</title>
<style>
:root{--a:#1d3f8a;--b:#0f2557;--g:linear-gradient(135deg,#1d3f8a,#0f2557);--gold:#d9a521;--gg:linear-gradient(135deg,#ecc96b,#d09a12);--t:#0f1f3d;--m:#6b7794}
*{box-sizing:border-box}button,input,select{font-family:inherit}
body{margin:0;font:16px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;color:var(--t);background:radial-gradient(520px 320px at 85% -8%,#cfdcf7,transparent),radial-gradient(420px 260px at -10% 8%,#f8eac0,transparent),#fff;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}

@keyframes u{from{opacity:0;transform:translateY(8px)}}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--g);color:#fff;font-weight:600;font-size:16px;margin-top:14px;cursor:pointer}
.btn.s{background:#eef2fb;color:var(--a)}.btn:disabled{opacity:.6}
.lk{border:0;background:#eef2fb;color:var(--a);border-radius:99px;padding:8px 14px;font-size:13px;cursor:pointer}

nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-top:1px solid #e3e9f5}
nav button{flex:1;background:0;border:0;min-height:48px;font-size:12px;color:var(--m)}nav button.on{color:var(--a);font-weight:700}
nav .fab{flex:0 0 60px;width:60px;height:60px;margin-top:-34px;border-radius:50%;background:var(--g);color:#fff;font-size:32px;box-shadow:0 8px 20px rgba(120,92,255,.4)}
.ov{position:fixed;inset:0;background:rgba(20,26,60,.35);display:flex;align-items:flex-end;z-index:9}
.sh{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:u .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}.m{color:var(--m);font-size:13px}
.bd{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#e6f8ef;color:#12875a}.bd.h{background:#ffeaea;color:#d33}
.bar{height:10px;border-radius:9px;background:#eef2fb;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g)}
.empty{text-align:center;color:var(--m);padding:40px 24px}
.sk{height:90px;border-radius:20px;margin:12px 16px;background:linear-gradient(90deg,#eef2fb,#f8f9ff,#eef2fb);background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f1f3d;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;max-width:90%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}.g2 .c{margin:0}
.tab{display:flex;gap:6px;margin:8px 16px}.tab button{flex:1;min-height:44px;border:0;border-radius:12px;background:#eef2fb;color:var(--a);font-weight:600;font-size:14px}.tab .on{background:var(--g);color:#fff}
.av{width:44px;height:44px;border-radius:50%;border:2px solid #e3e9f5;background:var(--g) center/cover;color:#fff;font-weight:700;font-size:18px;cursor:pointer}
.tt{border-collapse:collapse;font-size:13px;width:100%}.tt td,.tt th{padding:6px 8px;text-align:right;white-space:nowrap}.tt td:first-child,.tt th:first-child{text-align:left;color:var(--m)}.tt tr+tr td{border-top:1px solid #eef2fb}
.tc{padding:12px 0}.tc+.tc{border-top:1px solid #eef2fb}.tc svg{display:block;margin-top:4px}
.fn{text-align:center;color:var(--m);font-size:12px;line-height:1.6;margin:8px 16px 0}
.g3{display:grid;gap:8px;margin-top:6px}.prt{display:none}
@media print{nav,header,.tab,.noprint,.ov,.toast{display:none!important}body{padding:0;background:#fff}.c{box-shadow:none;break-inside:avoid;backdrop-filter:none}.prt{display:block;margin:16px;font-weight:700}}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.bgd{text-align:center;padding:10px 4px;border-radius:14px;background:#fbf3dc;font-size:12px}.bgd.off{opacity:.35;filter:grayscale(1)}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.c{border-radius:22px;background:rgba(255,255,255,.7);border:1px solid #e3e9f5;box-shadow:0 8px 28px rgba(15,37,87,.09)}
.bar i{background:var(--gg)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:8px 10px;border-radius:30px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(15,37,87,.16)}
nav button{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;height:48px;min-width:48px;padding:0 12px;border-radius:24px;color:var(--m);font-size:13px;font-weight:600;transition:all .25s}
nav button span{display:none}nav button.on{background:var(--g);color:#fff;box-shadow:0 6px 16px rgba(15,37,87,.3)}nav button.on span{display:inline}
nav .fab{width:60px;height:60px;min-width:60px;padding:0;margin-top:-34px;border-radius:50%;background:var(--gg);color:#0f2557;font-size:32px;font-weight:500;box-shadow:0 8px 22px rgba(208,154,18,.5)}
.orb{display:inline-block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f6e7b4,#d9a521 45%,#12285a 100%);box-shadow:0 4px 12px rgba(15,37,87,.25)}
.hero{padding:6px 20px 0}.hero h2{font-size:30px;line-height:1.15;margin:8px 0 0;font-weight:700}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px}
.qa button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:16px;color:var(--t);background:rgba(255,255,255,.75);backdrop-filter:blur(12px);border:1px solid #e3e9f5;border-radius:22px;box-shadow:0 8px 24px rgba(15,37,87,.08);min-height:96px}
.qa svg{color:var(--gold);margin-bottom:8px}.qa span{font-size:12px;color:var(--m)}
nav{justify-content:center;gap:0}
.ng{flex:1;min-width:0;display:flex;justify-content:space-around;align-items:center}
nav .fab{flex:0 0 60px;margin:-34px 6px 0}
nav button{padding:0;width:48px}
nav button.on{padding:0;width:48px}nav button.on span{display:none}
@media(min-width:400px){nav button.on{width:auto;padding:0 14px}nav button.on span{display:inline}}
nav{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border-color:rgba(255,255,255,.7)}
/* Glassmorphism bilah bawah: 68% putih, blur 24px, saturasi 1.8, tepi kaca, fallback & aksesibilitas */
nav{z-index:5;background:rgba(255,255,255,.68);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(15,37,87,.14),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(15,37,87,.05)}
nav .ng button:not(.on){color:#55607e}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:150px;z-index:1;pointer-events:none;background:linear-gradient(transparent,rgba(207,220,247,.55))}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav{background:rgba(255,255,255,.96)}}
@media (prefers-reduced-transparency:reduce){nav{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}
/* Glass seragam: header, kartu, aksi cepat, bottom sheet */
:root{--gl:rgba(255,255,255,.72);--gb:1px solid rgba(255,255,255,.75);--gs:0 8px 28px rgba(15,37,87,.10),inset 0 1px 0 rgba(255,255,255,.9)}
body{background:radial-gradient(520px 340px at 88% -6%,#cfdcf7,transparent),radial-gradient(420px 300px at -12% 28%,#f8eac0,transparent),radial-gradient(480px 360px at 105% 62%,#d6e2fa,transparent),radial-gradient(420px 320px at -10% 95%,#f9edc9,transparent),#fff;background-attachment:fixed}
.c,.qa button,header,.sh{background:var(--gl);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8)}
header{position:sticky;top:0;z-index:4;padding-bottom:10px;border-width:0 0 1px;border-radius:0 0 22px 22px}
.sh{background:rgba(255,255,255,.86);border-width:1px 0 0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.c,.qa button,header,.sh{background:rgba(255,255,255,.96)}}
@media (prefers-reduced-transparency:reduce){.c,.qa button,header,.sh{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}
.dots{display:flex;flex-wrap:wrap;gap:6px}.dots i{width:26px;height:26px;border-radius:50%;background:#e3e9f5;font-size:12px;display:grid;place-items:center;font-style:normal;cursor:pointer}.dots i.d{background:var(--g);color:#fff}.dots i.t{background:var(--gg);color:#0f2557;font-weight:700}
.xw{position:sticky;top:0;height:0;z-index:3;display:flex;justify-content:flex-end}
.xb{width:40px;height:40px;margin-top:-6px;border-radius:50%;border:1px solid #e3e9f5;background:rgba(255,255,255,.92);color:var(--t);font-size:18px;line-height:1;box-shadow:0 4px 14px rgba(15,37,87,.15);cursor:pointer}
.sh:has(.xw) h3{padding-right:48px}
.btn.gold{background:var(--gg);color:#0f2557;margin-top:10px}
.fr{display:grid;grid-template-columns:1fr 62px 80px;gap:8px;align-items:end;margin-top:2px}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:50px;padding:0 4px;border:0;border-bottom:1px solid #eef2fb;background:none;font-size:16px;font-weight:600;color:var(--t);text-align:left;cursor:pointer}
.tab{overflow-x:auto}.tab button{flex:1 0 auto;padding:0 14px}
</style></head><body><div id="app"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyncBaRg4Lv4t6uKYW2xhwsnS5FXcmsoDEO8mGRvCgtJOJnLPJoj5OlAQevUQAFO4tlUg/exec';
const $=s=>document.querySelector(s),S={t:localStorage.t,tab:'dash',sub:'umum',per:'bulan',fl:{unit:'',gender:'',age:''},med:[],wo:[],meal:[],prog:[],rencana:[],gz:'kal',pb:0,reg:false};
const N={gula:'Gula darah',td:'Tekanan darah',au:'Asam urat',kol:'Kolesterol'};
const REC={gula:'Kurangi gula & karbohidrat sederhana, perbanyak serat, dan ulangi cek gula darah.',td:'Kurangi garam, kelola stres, tidur cukup, dan pantau tekanan darah rutin.',au:'Kurangi jeroan, seafood tertentu & minuman manis; perbanyak minum air putih.',kol:'Kurangi gorengan & lemak jenuh; perbanyak sayur, buah, dan olahraga.'};
const OBAT={gula:'antidiabetik & strip/alat cek gula darah',td:'antihipertensi & tensimeter',au:'obat penurun asam urat & pereda nyeri sendi',kol:'obat/suplemen penurun kolesterol'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has=v=>v!==''&&v!=null,today=()=>new Date().toLocaleDateString('sv'),by=(a,b)=>a.tanggal<b.tanggal?-1:1;
const val=f=>Object.fromEntries(new FormData(f));
let AC={};
async function apic(a,p,ms){const k=a+JSON.stringify(p||0),c=AC[k];if(c&&Date.now()-c.t<ms)return c.d;const d=await api(a,p);AC[k]={t:Date.now(),d};return d}
async function api(a,p){if(!/^(boot|challenges|dashAdmin|listUsers|meta|foto|pangan|audit)$/.test(a)){const ch=/^(joinCh|leaveCh|saveCh|delCh|delUser)$/.test(a);Object.keys(AC).forEach(k=>{if(ch||!/^(challenges|pangan)/.test(k))delete AC[k]})}const r=await(await fetch(API,{method:'POST',body:JSON.stringify({a,p,t:S.t})})).json();
 if(!r.ok){if(/Sesi/.test(r.e))out();throw r.e}return r.d}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2800)}
const F=(n,l,v='',t='number',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" step="any" ${x}></label>`;
const SEL=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(([k,t])=>`<option value="${k}" ${k==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
function closable(d){const s=d.querySelector('.sh');
 s.insertAdjacentHTML('afterbegin','<div class="xw"><button type="button" class="xb" aria-label="Tutup" onclick="cl()">✕</button></div>');
 s.insertAdjacentHTML('beforeend','<button type="button" class="btn gold" onclick="cl()">Batal</button>');return d}
function sheet(h){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="sh">${h}</div>`;d.onclick=e=>{if(e.target==d)d.remove()};document.body.append(d);return d}
const cl=()=>document.querySelectorAll('.ov').forEach(x=>x.remove());
const spark=(v,w=110,h=30)=>{v=v.filter(x=>x!=null&&!isNaN(x));if(v.length<2)return'';const a=Math.min(...v),r=(Math.max(...v)-a)||1;
 return`<svg width="${w}" height="${h}"><polyline fill="none" stroke="#1d3f8a" stroke-width="2.5" stroke-linecap="round" points="${v.map((y,i)=>(i/(v.length-1)*w).toFixed(1)+','+(h-3-(y-a)/r*(h-6)).toFixed(1)).join(' ')}"/></svg>`};
const fl=(m,g,c)=>{const f={};
 if(has(m.gula))f.gula=+m.gula>=c[m.jenisGula=='puasa'?'gula_puasa':m.jenisGula=='2jam'?'gula_2jam':'gula_sewaktu'];
 if(has(m.sis)||has(m.dia))f.td=+m.sis>=c.sis||+m.dia>=c.dia;
 if(has(m.asamUrat))f.au=+m.asamUrat>(g=='Perempuan'?c.au_wanita:c.au_pria);
 if(has(m.kolesterol))f.kol=+m.kolesterol>=c.kol;return f};
const badge=h=>`<span class="bd ${h?'h':''}">${h?'Di atas normal':'Normal'}</span>`;

/* ---------- Auth ---------- */
function auth(){const r=S.reg;$('#app').innerHTML=`<div class="c" style="margin-top:8vh;text-align:center"><img src="logo.png" alt="SigerFit" style="display:block;width:min(48%,150px);height:auto;margin:6px auto 2px;mix-blend-mode:multiply"><p class="m">${r?'Buat akun pegawai':'Masuk untuk mencatat kesehatan Anda'}</p>
<form onsubmit="doAuth(event)">${r?F('nama','Nama lengkap','','text','required')+F('umur','Umur (tahun)','','number','required')+SEL('gender','Jenis kelamin',[['Laki-laki','Laki-laki'],['Perempuan','Perempuan']])+F('bb','Berat badan (kg)')+F('tb','Tinggi badan (cm)')+(S.units&&S.units.length?SEL('unit','Unit kerja',[['','Pilih unit…'],...S.units.map(x=>[x,x])]):'')+F('riwayat','Riwayat penyakit bawaan (jika ada)','','text'):''}
${F('email','Email','','email','required')}${F('password','Kata sandi (min. 6 karakter)','','password','required')}
${r?'<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" required style="width:24px;min-height:24px;margin:0">Saya setuju data kesehatan saya dipakai kantor secara agregat dan anonim.</label>':''}
<button class="btn">${r?'Daftar':'Masuk'}</button></form>
<button class="btn s" onclick="toReg()">${r?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button>${r?'':'<button type="button" class="lk" style="display:block;margin:14px auto 0" onclick="fForgot()">Lupa kata sandi?</button>'}</div><div class="fn">SigerFit v.1.0<br>Kantor Wilayah DJPb Provinsi Lampung<br>2026</div><p class="m" style="text-align:center;margin:0 0 24px;font-size:12px">SigerFit v.1.0</p>`}
async function doAuth(e){e.preventDefault();const b=e.target.querySelector('button');b.disabled=1;b.textContent='Memproses…';
 try{const d=await api(S.reg?'register':'login',val(e.target));S.t=localStorage.t=d.token;d.user?apply(d):await boot()}
 catch(x){toast(x);b.disabled=0;b.textContent=S.reg?'Daftar':'Masuk'}}
function out(){localStorage.removeItem('t');localStorage.removeItem('bd');S.t=null;S.u=null;auth()}

/* ---------- Shell ---------- */
const IP={h:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',m:'<path d="M12 21s-7.5-4.5-7.5-10.5A4.3 4.3 0 0112 8a4.3 4.3 0 017.5 2.5C19.5 16.5 12 21 12 21z"/>',w:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',a:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',u:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>',g:'<path d="M5 19c0-8 5-14 15-14 0 9-5 14-13 14M5 19c2-5 5-8 9-10"/>'};
const IC=Object.fromEntries(Object.entries(IP).map(([k,v])=>[k,`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${v}</svg>`]));
function scoreCard(l,f){if(!l)return'';const s=wkStats(),nf=Object.values(f).filter(Boolean).length,sk=Math.max(0,Math.round(100-12*nf-20*(1-Math.min(1,s.mc/s.tg)))),lb=sk>=80?'Baik':sk>=60?'Cukup':'Perlu perhatian',C=2*Math.PI*44;
 return`<div class="c"><div class="row"><div><b>Skor Kesehatan</b><div style="margin-top:14px"><span style="font-size:44px;font-weight:700;line-height:1">${sk}</span><span class="m"> /100</span></div><b style="color:${sk>=80?'#12875a':sk>=60?'#b8860b':'#d33'}">${lb}</b></div>
<svg width="116" height="116" viewBox="0 0 116 116"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecc96b"/><stop offset="1" stop-color="#d09a12"/></linearGradient></defs><circle cx="58" cy="58" r="44" fill="none" stroke="#e8edf8" stroke-width="12"/><circle cx="58" cy="58" r="44" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(C*sk/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 58 58)"/><svg x="46" y="46" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12285a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IP.m}</svg></svg></div>
<p class="m">Skor indikatif dari indikator terakhir dan progres workout; bukan diagnosis.</p></div>`}
const nb=(k,i,t)=>`<button data-k="${k}" onclick="S.tab='${k}';show()">${i}<span>${t}</span></button>`;
function shell(){$('#app').innerHTML=`<header><div class="row" style="gap:10px"><img src="icon-192.png" alt="" width="34" height="34" style="border-radius:10px"><h1>SigerFit</h1></div><div class="row"><button class="av" onclick="prof()" aria-label="Profil" ${avs()}>${S.u.fotoData?'':esc(S.u.nama[0]||'?')}</button>${S.u.role=='admin'?'<button class="lk" onclick="S.tab=\'adm\';show()">Admin</button>':''}<button class="lk" onclick="out()">Keluar</button></div></header><div id="main"></div>
<nav><div class="ng">${nb('dash',IC.h,'Beranda')}${nb('med',IC.m,'Medis')}</div><button class="fab" onclick="pick()" aria-label="Rekam Data" title="Rekam Data">+</button><div class="ng">${nb('wo',IC.w,'Workout')}${nb('gz',IC.g,'Nutrisi')}</div></nav>`}
async function show(q){document.querySelectorAll('nav button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==S.tab));
 const m=$('#main');if(!q)m.innerHTML='<div class="sk"></div><div class="sk"></div>';
 try{m.innerHTML=await V[S.tab]()}catch(x){m.innerHTML=`<div class="empty">${esc(x)}</div>`}}
async function boot(){try{if(!S.u&&localStorage.bd){try{const o=JSON.parse(localStorage.bd);if(S.t&&S.t.split('.')[0]==o.u.id){Object.assign(S,o);shell();show()}}catch(e){}}
 apply(await api('boot'))}catch(x){S.t?toast(x):auth()}}

function ch(n,ks,v,o={}){const u=o.unit||'',ys=v.filter(x=>x!=null);

 const W=300,H=120,L=26,R=26,T=18,B=22,r=o.ref,lo0=Math.min(...ys,r??Infinity),hi0=Math.max(...ys,r??-Infinity),pad=(hi0-lo0||1)*.15,lo=lo0-pad,hi=hi0+pad,
 X=i=>L+(ks.length>1?i/(ks.length-1):.5)*(W-L-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B),
 pts=v.map((y,i)=>y==null?null:[X(i),Y(y),y]).filter(Boolean),last=pts.at(-1),prev=pts.at(-2),

 return`<div class="tc"><div class="row"><b>${n}</b>${bdg}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tren ${esc(n)}">

const crit=v=>{const m=[],g=+v.gula,s=+v.sis,d=+v.dia,a=+v.asamUrat,k=+v.kolesterol;

kal(){const k=calc(),u=S.u,T=today(),ml=S.meal.filter(x=>x.tanggal==T),sm=f=>ml.reduce((s,x)=>s+(+x[f]||0),0);
 const res=k?`<div class="c"><div class="m">Target kalori harian</div><div><span style="font-size:40px;font-weight:700">${k.t}</span> <span class="m">kkal</span></div><div class="m">${k.dir==0?'Mempertahankan berat badan':(k.dir<0?'Menurunkan':'Menaikkan')+' berat ke '+k.tb+' kg · sekitar '+k.wk+' minggu'}</div>
<div class="row" style="margin-top:10px"><span class="m">BMR ${k.bmr} kkal</span><span class="m">Kebutuhan harian (TDEE) ${k.tdee} kkal</span></div>
<div class="g2" style="margin:12px 0 0;grid-template-columns:repeat(3,1fr)"><div class="c" style="padding:10px"><div class="m">Protein</div><b>${k.pr} g</b></div><div class="c" style="padding:10px"><div class="m">Karbo</div><b>${k.ch} g</b></div><div class="c" style="padding:10px"><div class="m">Lemak</div><b>${k.fa} g</b></div></div>
${k.lim?'<p class="m">Target dibatasi pada batas aman minimal; turunkan laju atau pilih target yang lebih realistis.</p>':''}<p class="m">Estimasi rumus Mifflin-St Jeor. Tidak untuk ibu hamil/menyusui atau kondisi medis khusus.</p></div>`:`<div class="c empty">Lengkapi umur, tinggi, dan berat badan di Profil untuk menghitung target.<br><button class="btn" onclick="prof()">Buka Profil</button></div>`;
 const form=`<form class="c" onsubmit="saveKal(event)"><h3>Target Saya</h3>${SEL('akt','Tingkat aktivitas',Object.entries(AKT),u.akt||1.375)}${F('tbb','Target berat badan (kg)',u.tbb||u.bb||'')}${SEL('laju','Laju perubahan berat',[[0.25,'Pelan – 0,25 kg/minggu'],[0.5,'Sedang – 0,5 kg/minggu'],[0.75,'Cepat – 0,75 kg/minggu']],u.laju||0.5)}<button class="btn">Simpan dan Hitung</button></form>`;
 const log=`<div class="c"><div class="row"><b>Asupan Hari Ini</b><button class="lk" onclick="fMeal()">+ Catat</button></div>${k?prow('Kalori',sm('kkal'),k.t,'kkal')+prow('Protein',sm('protein'),k.pr,'g')+prow('Karbo',sm('karbo'),k.ch,'g')+prow('Lemak',sm('lemak'),k.fa,'g'):''}
${ml.length?'<div class="m">Ketuk waktu makan untuk melihat, mengubah, atau menghapus.</div>'+[...new Set(ml.map(x=>x.waktu))].sort((p,q)=>WK.indexOf(p)-WK.indexOf(q)).map(w=>`<button class="mrow" onclick="mealSheet('${esc(w)}')"><span>${esc(w)}</span><span>${Math.round(ml.filter(x=>x.waktu==w).reduce((t,x)=>t+(+x.kkal||0),0))} kkal ›</span></button>`).join(''):'<p class="m">Belum ada makanan tercatat hari ini.</p>'}</div>`;
 return res+log+form},
plan(){const k=calc(),b=[1400,1700,2000,2400],a=S.pb||(k?b.reduce((x,y)=>Math.abs(y-k.t)<Math.abs(x-k.t)?y:x):1700),P=PLAN[a],R=S.rencana||[],sm=f=>R.reduce((t,x)=>t+(+x[f]||0),0),tk=sm('kkal'),W=['Sarapan','Makan siang','Makan malam','Selingan'],df=k?k.t-tk:0;
 const mine=`<div class="c"><div class="row"><b>Rencana Saya</b><button class="lk" onclick="fRc()">+ Tambah</button></div>
<div style="margin:10px 0"><span style="font-size:34px;font-weight:700">${Math.round(tk)}</span> <span class="m">kkal${k?' dari target '+k.t:''}</span></div>
${k?`<div class="bar"><i style="width:${Math.min(100,tk/k.t*100)}%"></i></div><div class="m">${!R.length?'Belum ada makanan. Tambahkan atau pakai paket contoh di bawah.':df>=0?'Sisa '+Math.round(df)+' kkal':'Lebih '+Math.round(-df)+' kkal dari target'}</div>${prow('Protein',sm('protein'),k.pr,'g')}${prow('Karbo',sm('karbo'),k.ch,'g')}${prow('Lemak',sm('lemak'),k.fa,'g')}`:'<p class="m">Lengkapi profil agar target kalori tampil.</p>'}
<div class="m" style="margin-top:10px">Ketuk waktu makan untuk menambah, mengubah, atau menghapus.</div>${W.map(w=>`<button class="mrow" onclick="rencSheet('${w}')"><span>${w}</span><span>${Math.round(R.filter(x=>x.waktu==w).reduce((t,x)=>t+(+x.kkal||0),0))} kkal ›</span></button>`).join('')}
${R.length?`<button class="btn" onclick="planToMeals()">Catat semua ke asupan hari ini</button><button class="btn s" onclick="clearPlan()">Kosongkan rencana</button>`:''}</div>`;
 return mine+`<div class="c"><b>Paket Contoh</b><p class="m">${k?'Target Anda '+k.t+' kkal; paket terdekat ditampilkan.':'Pilih paket kalori.'}</p><div class="tab" style="margin:0 0 8px">${b.map(x=>`<button class="${x==a?'on':''}" onclick="S.pb=${x};show()">${x}</button>`).join('')}</div>
${P.map(m=>`<div class="row"><div><b>${m[0]}</b><div class="m">${m[1]}</div></div><span class="bd">${m[2]} kkal</span></div>`).join('')}<button class="btn s" onclick="useSample(${a})">Pakai sebagai rencana saya</button><p class="m">Porsi dan makronutrien perkiraan; ubah sesuai kebutuhan.</p></div>`},
prog(){return PROG.map(p=>{const r=S.prog.find(x=>x.pid==p.id),n=p.days.length;
 if(!r)return`<div class="c"><div class="row"><b>${p.ikon} ${p.nama}</b><span class="bd">${n} hari</span></div><p class="m">${p.desc}</p><button class="btn" onclick="progAct('startProg','${p.id}')">Mulai program</button></div>`;
 const dn=(String(r.hari||'').match(/\d+/g)||[]).map(Number),cur=Math.min(n,Math.max(0,daysSince(r.mulai))+1),t=p.days[cur-1],ok=dn.includes(cur);
 return`<div class="c"><div class="row"><b>${p.ikon} ${p.nama}</b><span class="bd">${dn.length}/${n} hari</span></div><div class="bar"><i style="width:${dn.length/n*100}%"></i></div><p><b>Hari ${cur}: ${t[0]}</b><br><span class="m">${t[1]}</span></p>
<button class="btn ${ok?'s':''}" onclick="progAct('doneDay','${p.id}',${cur})">${ok?'✓ Selesai (ketuk untuk batal)':'Tandai selesai hari ini'}</button>
<div class="dots" style="margin-top:12px">${p.days.map((_,i)=>`<i class="${dn.includes(i+1)?'d':i+1==cur?'t':''}" ${i+1<=cur?`onclick="progAct('doneDay','${p.id}',${i+1})"`:''}>${i+1}</i>`).join('')}</div>
<div class="row" style="margin-top:12px"><span class="m">${dn.length>=n?'🎉 Program selesai!':'Mulai '+r.mulai}</span><button class="lk" onclick="progAct('quitProg','${p.id}')">Berhenti</button></div></div>`}).join('')}};

function rencSheet(w){const it=S.rencana.filter(x=>x.waktu==w);if(!it.length)return foodForm('Tambah ke Rencana','saveRencana',{waktu:w},1);
 const d=sheet(`<h3>${esc(w)} · ${Math.round(it.reduce((t,x)=>t+(+x.kkal||0),0))} kkal</h3>${it.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #eef2fb"><div><b>${esc(x.nama)}${+x.jml!=1?' ×'+x.jml:''}</b><div class="m">${Math.round(x.kkal)} kkal</div></div><span><button class="lk" onclick="cl();foodEdit('Ubah Makanan','saveRencana',S.rencana.find(z=>z.id=='${x.id}'),1)">Ubah</button> <button class="lk" onclick="cl();del('Rencana','${x.id}')">Hapus</button></span></div>`).join('')}<button class="btn s" onclick="cl();foodForm('Tambah ke Rencana','saveRencana',{waktu:'${w}'},1)">+ Tambah makanan</button>`);closable(d)}
const WK=['Sarapan','Makan siang','Makan malam','Selingan'];
function mealSheet(w){const T=today(),it=S.meal.filter(x=>x.tanggal==T&&x.waktu==w);
 const d=sheet(`<h3>${esc(w)} · ${Math.round(it.reduce((t,x)=>t+(+x.kkal||0),0))} kkal</h3>${it.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #eef2fb"><div><b>${esc(x.nama)}</b><div class="m">${Math.round(x.kkal)} kkal</div></div><span><button class="lk" onclick="cl();foodEdit('Ubah Makanan','saveMeal',S.meal.find(z=>z.id=='${x.id}'))">Ubah</button> <button class="lk" onclick="cl();del('Meal','${x.id}')">Hapus</button></span></div>`).join('')}<button class="btn s" onclick="cl();foodForm('Catat Makanan','saveMeal',{waktu:'${esc(w)}'})">+ Tambah makanan</button>`);closable(d)}

function fForgot(){cl();const d=sheet(`<h3>Lupa Kata Sandi</h3><p class="m">Masukkan email akun Anda. Kami kirim kode 6 digit ke email tersebut.</p><form>${F('email','Email','','email','required')}<button class="btn">Kirim Kode</button></form><p class="m">Email tidak masuk? Cek folder spam, atau hubungi admin untuk reset manual.</p>`);
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button'),em=val(e.target).email;b.disabled=1;b.textContent='Mengirim…';
  try{await api('forgot',{email:em});d.remove();toast('Jika email terdaftar, kode sudah dikirim');fReset(em)}catch(x){toast(x);b.disabled=0;b.textContent='Kirim Kode'}}}
function fReset(em){const d=sheet(`<h3>Atur Kata Sandi Baru</h3><p class="m">Kode berlaku 15 menit.</p><form>${F('kode','Kode 6 digit dari email','','text','required inputmode="numeric" maxlength="6" autocomplete="one-time-code"')}${F('baru','Kata sandi baru (min. 6 karakter)','','password','required')}${F('ulang','Ulangi kata sandi baru','','password','required')}<button class="btn">Simpan Kata Sandi</button></form><button class="btn s" onclick="fForgot()">Kirim ulang kode</button>`);
 d.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=1;b.textContent='Menyimpan…';
  try{await api('resetCode',{...val(e.target),email:em});d.remove();toast('Kata sandi diganti. Silakan masuk.')}catch(x){toast(x);b.disabled=0;b.textContent='Simpan Kata Sandi'}}}
